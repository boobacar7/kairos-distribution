# Local development backing services.
#
# Application processes run on the host via `pnpm dev`, not in containers: HMR through a bind
# mount is markedly slower and is the main reason developers abandon containerised development.
# Compose provides the things that genuinely benefit from being pinned and disposable.
#
# Mailpit (notification capture) and MinIO (S3-compatible storage) join this file in the phases
# that introduce notifications and media. PostgreSQL is what Phase 2 needs.
#
# Credentials here are local development defaults, overridable from .env, and are never used
# anywhere else. Real credentials do not belong in this repository.

services:
  postgres:
    image: postgres:17-alpine
    container_name: kairos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kairos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kairos}
      POSTGRES_DB: ${POSTGRES_DB:-kairos_dev}
      # Deterministic collation so index ordering matches across developer machines and CI.
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Migrations and integration tests must wait for readiness, not for a fixed sleep.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-kairos} -d ${POSTGRES_DB:-kairos_dev}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
    driver: local
